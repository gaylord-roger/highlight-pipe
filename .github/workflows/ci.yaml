name: Node.js Package
on:
  push:
    branches: [main]
  release:
    types: [created]

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      highlight: ${{ steps.filter.outputs.highlight }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            highlight:
              - 'projects/highlight-pipe/**'

  build:
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - run: cp README.md dist/highlight-pipe/README.md

      - uses: actions/upload-artifact@v4
        with:
          name: highlight-pipe
          path: dist/highlight-pipe

  publish:
    runs-on: ubuntu-latest
    needs:
      - build
      - changes

    if: |
      github.event_name == 'release' ||
      needs.changes.outputs.highlight == 'true'

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: highlight-pipe
          path: .

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: "@gene6"

      - run: npm publish
        working-directory: .
